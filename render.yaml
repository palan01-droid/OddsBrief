services:
  - type: web
    name: oddsbrief
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: BEHIND_PROXY
        value: "1"
      - key: TZ
        value: America/Chicago
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: KALSHI_KEY_PATH
        value: /etc/secrets/kalshi.key
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: KALSHI_KEY_ID
        sync: false
      - key: ADMIN_USERNAME
        sync: false
